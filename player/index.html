<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ecebe7">
<title>Pebbble</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="player.css">
</head>
<body>

<!-- Views are drawn into #app by player.js: arrival, pebbble page, library. -->
<div class="app" id="app"></div>

<div class="scrim" id="scrim"></div>

<!-- First time on this phone -->
<div class="sheet" id="device-sheet" role="dialog" aria-labelledby="device-title">
    <div class="handle"></div>
    <h2 id="device-title" data-i18n="device.title"></h2>
    <p class="lead" data-i18n="device.lead"></p>
    <button class="choice" id="device-yes"><b data-i18n="device.yes"></b><span data-i18n="device.yesText"></span></button>
    <button class="choice" id="device-no"><b data-i18n="device.no"></b><span data-i18n="device.noText"></span></button>
</div>

<!-- Password -->
<form class="sheet" id="lock-sheet" autocomplete="off" onsubmit="return false" role="dialog" aria-labelledby="lock-title">
    <div class="handle"></div>
    <h2 id="lock-title" data-i18n="lock.title"></h2>
    <p class="lead" data-i18n="lock.lead"></p>
    <p class="hint" id="hint"></p>
    <input class="field" id="pw" type="password" autocomplete="off" data-lpignore="true" data-i18n-placeholder="lock.password">
    <button class="primary" type="submit" id="unlock" data-i18n="lock.open"></button>
    <p class="lock-msg" id="lock-msg"></p>
</form>

<!-- This pebbble -->
<div class="sheet" id="menu-sheet" role="dialog" aria-labelledby="menu-name">
    <div class="handle"></div>
    <div class="sheet-head"><div class="stone" id="menu-stone"></div><h2 id="menu-name"></h2></div>
    <button class="menu-row" id="m-edit"></button>
    <button class="menu-row warn" id="m-forget"></button>
    <button class="menu-row" id="m-settings"></button>
</div>

<!-- Settings -->
<div class="sheet" id="settings-sheet" role="dialog" aria-labelledby="settings-title">
    <div class="handle"></div>
    <h2 id="settings-title" data-i18n="settings.title"></h2>
    <div class="set-group">
        <label data-i18n="settings.language"></label>
        <div class="chips" id="langs"></div>
    </div>
    <div class="set-group">
        <label data-i18n="settings.phone"></label>
        <button class="choice" id="set-mine"><b data-i18n="settings.mine"></b><span data-i18n="settings.mineText"></span></button>
        <button class="choice" id="set-notmine"><b data-i18n="settings.notMine"></b><span data-i18n="settings.notMineText"></span></button>
    </div>
    <div class="set-group">
        <button class="danger" id="clear" data-i18n="settings.clear"></button>
    </div>
    <p class="version">Pebbble</p>
</div>

<!-- The pebbble: stone, now playing, controls and its voices, in one sheet.
     Drag it down to fold it into the mini player. -->
<div class="sheet player" id="player" role="dialog" aria-labelledby="pl-name">
    <div class="drag-zone" id="drag-zone">
        <div class="handle"></div>
        <div class="top">
            <button class="icon-btn" id="collapse" data-i18n-label="player.close"><svg class="icon" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
            <span class="from" id="pl-name"></span>
            <button class="icon-btn" id="open-menu" data-i18n-label="menu.label"><svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></svg></button>
        </div>
        <div class="stage">
            <div class="stone" id="pl-stone"></div>
            <h2 class="serif" id="pl-title"></h2>
            <div class="soft" id="pl-sub"></div>
        </div>
    </div>
    <div id="controls">
        <div class="progress" id="progress"><div class="track"></div><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div>
        <div class="times"><span id="t-now">0:00</span><span id="t-left">-0:00</span></div>
        <div class="transport">
            <button class="icon-btn" id="prev" data-i18n-label="player.prev"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6L9 12l9 6z"/><path d="M6 6v12"/></svg></button>
            <button class="play-big" id="play" data-i18n-label="player.play"></button>
            <button class="icon-btn" id="next" data-i18n-label="player.next"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l9 6-9 6z"/><path d="M18 6v12"/></svg></button>
        </div>
        <div class="modes">
            <button class="mode" id="repeat"></button>
            <button class="mode" id="sleep"></button>
        </div>
        <div class="sleep-choices" id="sleep-choices" hidden></div>
    </div>
    <!-- Only the voices scroll; the stone, name and controls stay in place. -->
    <div class="scroll" id="pl-scroll">
        <p class="status inline" id="pl-status" hidden></p>
        <ol class="voices" id="voices"></ol>
        <p class="foot-note" id="pl-foot"></p>
        <p class="saved-note" id="saved-note"></p>
    </div>
</div>

<!-- Mini player -->
<div class="mini" id="mini">
    <div class="mini-inner" id="mini-open">
        <div class="stone" id="mini-stone"></div>
        <div class="txt"><b id="mini-title"></b><span id="mini-sub"></span></div>
        <button class="icon-btn" id="mini-play" data-i18n-label="player.play"></button>
        <div class="line" id="mini-line"></div>
    </div>
</div>

<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="auto"></audio>

<script type="module" src="player.js"></script>
</body>
</html>
