<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ecebe7">
<title>Pebbble · player prototype</title>
<link rel="icon" href="../player/icons/icon-192.png">
<style>
:root {
    --bg: #ecebe7; --paper: #f6f5f2; --ink: #1d1b18; --soft: #66625a; --faint: #9d988e; --line: #dcd8cf;
    --accent: #3f5e4a; --accent-soft: #e3e8e2;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.22, .8, .24, 1);
    color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.serif { font-family: var(--serif); font-weight: 400; letter-spacing: -.01em; }
.soft { color: var(--soft); }
.faint { color: var(--faint); }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; position: relative; padding: 0 24px calc(96px + env(safe-area-inset-bottom)); }

/* stone */
.stone svg { display: block; width: 100%; height: auto; }
.stone.breathing { animation: breathe 6s var(--ease) infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.025) rotate(.6deg); } }
.appear { animation: appear 1.2s var(--ease) both; }
.appear.d1 { animation-delay: .25s; } .appear.d2 { animation-delay: .5s; } .appear.d3 { animation-delay: .8s; } .appear.d4 { animation-delay: 1.2s; }
@keyframes appear { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }

/* buttons */
.primary { display: block; width: 100%; padding: 16px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 600; letter-spacing: .01em; }
.primary:active { transform: scale(.98); }
.ghost { display: block; width: 100%; padding: 14px; border-radius: 999px; border: 1px solid var(--line); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
.icon-btn:active { background: rgba(0,0,0,.05); }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* top bar */
.bar { display: flex; justify-content: space-between; align-items: center; height: 56px; margin: 0 -10px; padding-top: env(safe-area-inset-top); }
.bar .title { font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }

/* arrival */
.arrival { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 0 32px; }
.eyebrow { font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); margin: 0 0 28px; }
.arrival .stone { width: min(62vw, 250px); }
.arrival h1 { font-size: 2rem; line-height: 1.15; margin: 28px 0 6px; }
.arrival .count { margin: 0 0 36px; }
.arrival .primary { max-width: 280px; }
.owner-note { margin-top: 40px; font-size: .85rem; color: var(--soft); line-height: 1.55; max-width: 300px; }
.owner-note b { color: var(--ink); font-weight: 600; }

/* pebbble page */
.pebbble-head { text-align: center; padding: 8px 0 20px; }
.pebbble-head .stone { width: min(44vw, 170px); margin: 0 auto; }
.pebbble-head h1 { font-size: 1.7rem; line-height: 1.2; margin: 18px 0 4px; }
.pebbble-head .meta { font-size: .9rem; }
.menu-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px 4px; border-top: 1px solid var(--line); }
.menu-row:last-of-type { border-bottom: 1px solid var(--line); }
.menu-row b { display: block; font-weight: 600; }
.menu-row span { font-size: .88rem; color: var(--soft); }
.menu-row.warn b { color: #9a3b2a; }
.menu-row.confirm { background: #f3e6e2; border-radius: 12px; border-color: transparent; padding-left: 12px; }
.sheet-head { display: flex; align-items: center; gap: 14px; margin: 4px 0 18px; }
.sheet-head .stone { width: 52px; }
.sheet-head h2 { margin: 0; }
.edit-link { display: inline-block; margin-top: 10px; font-size: .85rem; font-weight: 600; color: var(--accent); text-decoration: none; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); }
.voices { list-style: none; margin: 8px 0 0; padding: 0; }
.voice { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.voice:last-child { border-bottom: 1px solid var(--line); }
.voice .n { width: 22px; text-align: center; font-size: .85rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.voice .t { flex: 1; }
.voice .d { font-size: .85rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.voice.current .t { font-weight: 600; }
.voice.current .n { color: var(--accent); }
.voice.sleeping { cursor: default; }
.voice.sleeping .t { color: var(--soft); }
.voice .wake { display: block; font-size: .8rem; color: var(--faint); }
.eq { display: inline-flex; gap: 2px; align-items: end; height: 12px; }
.eq i { width: 3px; background: var(--accent); border-radius: 1px; animation: eq 1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .4s; }
.eq.paused i { animation: none; height: 4px; }
@keyframes eq { 0%, 100% { height: 4px; } 50% { height: 12px; } }
.foot-note { margin: 28px 0 0; font-size: .82rem; color: var(--faint); text-align: center; line-height: 1.6; }

/* library */
.library h1 { font-size: 1.7rem; margin: 8px 0 24px; }
.shelf { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 20px; }
.shelf button { text-align: center; }
.shelf .stone { width: 78%; margin: 0 auto 12px; transition: transform .4s var(--ease); }
.shelf button:active .stone { transform: scale(.96); }
.shelf .name { font-family: var(--serif); font-size: 1.1rem; line-height: 1.25; }
.shelf .sub { font-size: .8rem; color: var(--faint); }
.empty { text-align: center; padding-top: 18vh; }
.rings { position: relative; width: 120px; height: 120px; margin: 0 auto 28px; }
.rings i { position: absolute; inset: 0; border: 1px solid var(--soft); border-radius: 50%; opacity: 0; animation: ring 3.6s var(--ease) infinite; }
.rings i:nth-child(2) { animation-delay: 1.2s; } .rings i:nth-child(3) { animation-delay: 2.4s; }
.rings b { position: absolute; inset: 38%; background: var(--ink); border-radius: 46% 54% 50% 50% / 55% 45% 55% 45%; }
@keyframes ring { from { transform: scale(.35); opacity: .7; } to { transform: scale(1); opacity: 0; } }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(29,27,24,.28); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); z-index: 20; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 440px; margin: 0 auto; background: var(--paper); border-radius: 22px 22px 0 0; padding: 10px 24px calc(28px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .45s var(--ease); z-index: 30; box-shadow: 0 -10px 40px rgba(0,0,0,.08); }
.sheet.on { transform: none; }
.handle { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 18px; }
.sheet h2 { font-family: var(--serif); font-weight: 400; font-size: 1.5rem; margin: 6px 0 6px; }
.sheet p.lead { color: var(--soft); margin: 0 0 20px; }
.choice { display: block; width: 100%; text-align: left; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; }
.choice b { display: block; font-weight: 600; margin-bottom: 2px; }
.choice span { font-size: .9rem; color: var(--soft); }
.choice.selected { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.field { width: 100%; padding: 15px 16px; border: 1px solid var(--line); border-radius: 14px; background: #fff; font: inherit; margin-bottom: 14px; }
.field:focus { outline: none; border-color: var(--ink); }
.hint { font-family: var(--serif); font-style: italic; font-size: 1.1rem; margin: 0 0 18px; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* mini player */
.mini { position: fixed; left: 0; right: 0; bottom: 0; max-width: 440px; margin: 0 auto; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); z-index: 10; transform: translateY(130%); transition: transform .45s var(--ease); }
.mini.on { transform: none; }
.mini-inner { display: flex; align-items: center; gap: 12px; background: var(--paper); border-radius: 18px; padding: 10px 10px 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.10); position: relative; overflow: hidden; cursor: pointer; }
.mini .stone { width: 38px; flex: 0 0 38px; }
.mini .txt { flex: 1; min-width: 0; }
.mini .txt b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .txt span { font-size: .8rem; color: var(--faint); }
.mini .line { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--ink); }

/* full player */
.player { top: 0; border-radius: 0; padding-top: calc(8px + env(safe-area-inset-top)); display: flex; flex-direction: column; max-width: 440px; }
.player .top { display: flex; justify-content: space-between; align-items: center; margin: 0 -10px; }
.player .top .from { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
.player .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; min-height: 0; }
.player .stone { width: min(64vw, 270px); }
.player h2 { font-size: 1.6rem; margin: 26px 0 2px; }
.progress { margin: 24px 0 6px; height: 20px; position: relative; cursor: pointer; }
.progress .track { position: absolute; left: 0; right: 0; top: 9px; height: 2px; background: var(--line); border-radius: 1px; }
.progress .fill { position: absolute; left: 0; top: 9px; height: 2px; background: var(--ink); border-radius: 1px; }
.progress .dot { position: absolute; top: 4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--ink); }
.times { display: flex; justify-content: space-between; font-size: .8rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.transport { display: flex; justify-content: center; align-items: center; gap: 28px; margin: 18px 0 22px; }
.play-big { width: 72px; height: 72px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.play-big .icon { width: 28px; height: 28px; fill: currentColor; stroke: none; }
.modes { display: flex; justify-content: space-between; gap: 10px; }
.mode { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); font-size: .88rem; }
.mode.active { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.sleep-choices { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
.sleep-choices button { flex: 1; padding: 10px 6px; border-radius: 12px; border: 1px solid var(--line); font-size: .85rem; white-space: nowrap; }
.sleep-choices button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.toast { position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top)); transform: translate(-50%, -12px); opacity: 0; background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: .88rem; transition: all .4s var(--ease); z-index: 60; pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* settings */
.set-group { margin: 22px 0 0; }
.set-group > label { display: block; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); }
.chips button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.danger { color: #9a3b2a; padding: 12px 0; font-weight: 600; }
.version { font-size: .78rem; color: var(--faint); margin-top: 18px; }

/* prototype scene switcher */
.scenes { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 100; background: rgba(29,27,24,.82); color: #f6f5f2; border-radius: 999px; padding: 4px 6px 4px 14px; font-size: .78rem; display: flex; gap: 6px; align-items: center; backdrop-filter: blur(6px); }
.scenes select { background: transparent; color: inherit; border: 0; font: inherit; font-weight: 600; max-width: 190px; }
.scenes select option { color: var(--ink); }
.scenes button { color: inherit; opacity: .7; padding: 2px 6px; }
body.hide-scenes .scenes { display: none; }
</style>
</head>
<body>

<div class="scenes" id="scenes">
    Scene
    <select id="scene">
        <option value="first">1 · First tap (a finder, or a new phone)</option>
        <option value="locked">2 · A locked pebbble</option>
        <option value="listening">3 · Listening</option>
        <option value="library">4 · My pebbbles (my phone)</option>
        <option value="empty">5 · Nothing yet</option>
        <option value="settings">6 · Settings</option>
        <option value="forget">7 · Forget a pebbble</option>
        <option value="creator">8 · On the creator's phone</option>
    </select>
    <button id="hide-scenes" title="Hide (tap top edge to show)">✕</button>
</div>

<div class="app" id="app"></div>

<div class="scrim" id="scrim"></div>

<!-- first-time device question -->
<div class="sheet" id="device-sheet">
    <div class="handle"></div>
    <h2>Is this your phone?</h2>
    <p class="lead">Asked once. You can change it later in settings.</p>
    <button class="choice" data-owned="yes"><b>Yes, it's mine</b><span>The voices stay on this phone, even without internet.</span></button>
    <button class="choice" data-owned="no"><b>No, I'm just listening</b><span>Nothing is kept. Tap the stone again to listen again.</span></button>
</div>

<!-- password -->
<div class="sheet" id="lock-sheet">
    <div class="handle"></div>
    <h2>This pebbble is locked</h2>
    <p class="lead">Its voices open with a word you know.</p>
    <p class="hint" id="hint"></p>
    <input class="field" id="pw" type="password" autocomplete="off" placeholder="Password" data-lpignore="true">
    <button class="primary" id="unlock">Open</button>
    <p class="soft" style="font-size:.85rem;text-align:center;margin:12px 0 0">Try “caillou”.</p>
</div>

<!-- this pebbble -->
<div class="sheet" id="menu-sheet">
    <div class="handle"></div>
    <div class="sheet-head"><div class="stone" id="menu-stone"></div><h2 id="menu-name"></h2></div>
    <button class="menu-row" id="m-edit"></button>
    <button class="menu-row warn" id="m-forget"></button>
    <button class="menu-row" id="m-settings"></button>
</div>

<!-- settings -->
<div class="sheet" id="settings-sheet">
    <div class="handle"></div>
    <h2>Settings</h2>
    <div class="set-group">
        <label>Language</label>
        <div class="chips" id="langs"><button class="on">English</button><button>Français</button><button>Español</button><button>中文</button></div>
    </div>
    <div class="set-group">
        <label>This phone</label>
        <button class="choice" data-mode="yes"><b>Mine</b><span>Keeps voices here for listening offline.</span></button>
        <button class="choice" data-mode="no"><b>Not mine</b><span>Keeps nothing. Everything is gone when closed.</span></button>
    </div>
    <div class="set-group">
        <button class="danger" id="clear">Remove saved voices from this phone</button>
    </div>
    <p class="version">Pebbble · player prototype</p>
</div>

<!-- full player -->
<div class="sheet player" id="player">
    <div class="top">
        <button class="icon-btn" id="collapse" aria-label="Close player"><svg class="icon" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <span class="from" id="pl-from"></span>
        <span style="width:44px"></span>
    </div>
    <div class="stage">
        <div class="stone breathing" id="pl-stone"></div>
        <h2 class="serif" id="pl-title"></h2>
        <div class="soft" id="pl-sub"></div>
    </div>
    <div class="progress" id="progress"><div class="track"></div><div class="fill" id="fill"></div><div class="dot" id="dot"></div></div>
    <div class="times"><span id="t-now">0:00</span><span id="t-left">-0:00</span></div>
    <div class="transport">
        <button class="icon-btn" id="prev" aria-label="Previous"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6L9 12l9 6z"/><path d="M6 6v12"/></svg></button>
        <button class="play-big" id="play" aria-label="Play or pause"></button>
        <button class="icon-btn" id="next" aria-label="Next"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l9 6-9 6z"/><path d="M18 6v12"/></svg></button>
    </div>
    <div class="modes">
        <button class="mode" id="repeat"></button>
        <button class="mode" id="sleep"></button>
    </div>
    <div class="sleep-choices" id="sleep-choices" hidden></div>
</div>

<!-- mini player -->
<div class="mini" id="mini">
    <div class="mini-inner" id="mini-open">
        <div class="stone" id="mini-stone"></div>
        <div class="txt"><b id="mini-title"></b><span id="mini-sub"></span></div>
        <button class="icon-btn" id="mini-play" aria-label="Play or pause"></button>
        <div class="line" id="mini-line"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { pebbleCover } from '../shared/cover.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const stone = (seed, detail = 'full') => pebbleCover(seed, { detail });

const ICON = {
    play: '<svg class="icon" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
    pause: '<svg class="icon" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
    playLine: '<svg class="icon" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg>',
    pauseLine: '<svg class="icon" viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></svg>',
    repeat: '<svg class="icon" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/></svg>',
    moon: '<svg class="icon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
    gear: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
    dots: '<svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/></svg>',
    pen: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',
    leaf: '<svg class="icon" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/></svg>',
    back: '<svg class="icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
    sleepMark: '<svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
};

// ---------- mock data (real stones, pretend content) ----------
const PEBBBLES = [
    { seed: 'SefrxbIguCTBXJL9', name: 'Lullabies', owner: 'Gab', contact: 'gab@example.com', voices: [
        { t: 'Good night, little one', d: 142 }, { t: 'The river song', d: 201 }, { t: 'Counting stars', d: 95 },
        { t: 'Christmas morning', d: 120, wake: 'Wakes on 20 December' }, { t: 'For your seventh birthday', d: 88, wake: 'Wakes on 14 March' } ] },
    { seed: 'AIxRfp43lV4stGBZ', name: 'Letters from Munich', owner: 'Papa', contact: 'papa@example.com', hint: 'What you throw in the river', voices: [
        { t: 'The workshop smells of cedar', d: 174 }, { t: 'A walk by the Isar', d: 233 }, { t: 'Why the sky turns orange', d: 118 } ] },
    { seed: 'Z9d12eqgKNpSxCnJ', name: 'Summer 2026', owner: 'Gab', contact: 'gab@example.com', voices: [
        { t: 'Waves at Étretat', d: 305 }, { t: 'The cicadas', d: 61 } ] },
];

// ---------- state ----------
const S = { view: 'arrival', pebbble: PEBBBLES[0], fromLibrary: false, mine: false, creator: false, owned: null, library: PEBBBLES,
    idx: 0, time: 0, playing: false, repeat: 'off', sleep: 0, sleepLeft: 0 };
const playable = () => S.pebbble.voices.map((v, i) => ({ ...v, i })).filter(v => !v.wake);
const current = () => S.pebbble.voices[S.idx];

// ---------- views ----------
function render(keepScroll = false) {
    const y = window.scrollY;
    const app = $('app');
    if (S.view === 'arrival') {
        const p = S.pebbble;
        const open = p.voices.filter(v => !v.wake).length;
        app.innerHTML = `<section class="arrival">
            <p class="eyebrow appear">You found a pebbble</p>
            <div class="stone appear d1">${stone(p.seed)}</div>
            <h1 class="serif appear d2">${esc(p.name)}</h1>
            <p class="count soft appear d2">${open} voice${open === 1 ? '' : 's'} inside${p.voices.length > open ? `, ${p.voices.length - open} still asleep` : ''}</p>
            <button class="primary appear d3" id="listen">Listen</button>
            <p class="owner-note appear d4">This pebbble belongs to <b>${esc(p.owner)}</b>.<br>If you found it, please <a href="mailto:${esc(p.contact)}">write to ${esc(p.contact)}</a>.</p>
        </section>`;
        $('listen').onclick = afterListen;
    }
    if (S.view === 'pebbble') {
        const p = S.pebbble;
        app.innerHTML = `
            <div class="bar">
                ${S.fromLibrary ? `<button class="icon-btn" id="to-lib" aria-label="My pebbbles">${ICON.back}</button>` : '<span style="width:44px"></span>'}
                <span class="title">${S.fromLibrary ? 'My pebbbles' : ''}</span>
                <button class="icon-btn" id="open-menu" aria-label="This pebbble">${ICON.dots}</button>
            </div>
            <div class="pebbble-head">
                <div class="stone ${S.playing ? 'breathing' : ''}" id="head-stone">${stone(p.seed)}</div>
                <h1 class="serif">${esc(p.name)}</h1>
                <div class="meta soft">${esc(p.owner)} · ${p.voices.length} voices</div>
            </div>
            <ol class="voices">${p.voices.map((v, i) => {
                const cur = i === S.idx && S.started;
                if (v.wake) return `<li class="voice sleeping"><span class="n">${ICON.sleepMark}</span><span class="t">${esc(v.t)}<span class="wake">${v.wake}</span></span></li>`;
                return `<li class="voice ${cur ? 'current' : ''}" data-i="${i}"><span class="n">${cur ? `<span class="eq ${S.playing ? '' : 'paused'}"><i></i><i></i><i></i></span>` : i + 1}</span><span class="t">${esc(v.t)}</span><span class="d">${mmss(v.d)}</span></li>`;
            }).join('')}</ol>
            <p class="foot-note">Belongs to ${esc(p.owner)} · if found, <a href="mailto:${esc(p.contact)}">${esc(p.contact)}</a></p>`;
        for (const li of app.querySelectorAll('.voice[data-i]')) li.onclick = () => { playAt(+li.dataset.i); openPlayer(); };
        if ($('to-lib')) $('to-lib').onclick = () => { S.view = 'library'; render(); };
        $('open-menu').onclick = openMenu;
    }
    if (S.view === 'library') {
        if (!S.library.length) {
            app.innerHTML = `<div class="bar"><span></span><span></span><button class="icon-btn" id="open-settings" aria-label="Settings">${ICON.gear}</button></div>
                <section class="empty"><div class="rings"><i></i><i></i><i></i><b></b></div>
                <h1 class="serif" style="font-size:1.6rem;margin:0 0 8px">Hold a pebbble close</h1>
                <p class="soft" style="max-width:280px;margin:0 auto">Touch the back of your phone with the stone. Its voices open here.</p>
                <p class="faint" style="font-size:.82rem;max-width:280px;margin:18px auto 0">iPhone: keep the screen unlocked, hold the stone near the top, then tap the notification.</p></section>`;
        } else {
            app.innerHTML = `<div class="bar"><span></span><span></span><button class="icon-btn" id="open-settings" aria-label="Settings">${ICON.gear}</button></div>
                <section class="library"><h1 class="serif">My pebbbles</h1>
                <div class="shelf">${S.library.map((p, i) => `<button data-i="${i}"><div class="stone">${stone(p.seed)}</div><div class="name">${esc(p.name)}</div><div class="sub">${p.voices.length} voices</div></button>`).join('')}</div></section>`;
            for (const b of app.querySelectorAll('.shelf button')) b.onclick = () => { openPebbble(S.library[+b.dataset.i], true); };
        }
        $('open-settings').onclick = () => openSheet('settings-sheet');
    }
    window.scrollTo(0, keepScroll ? y : 0);
    renderMini();
}

// ---------- flow ----------
function afterListen() {
    if (S.owned === null) return openSheet('device-sheet');
    if (S.pebbble.hint && !S.unlocked) return askPassword();
    S.view = 'pebbble';
    playAt(playable()[0].i);
    render();
    openPlayer();
}

function askPassword() {
    $('hint').textContent = `“${S.pebbble.hint}”`;
    $('pw').value = '';
    openSheet('lock-sheet');
    setTimeout(() => $('pw').focus(), 400);
}

$('unlock').onclick = () => {
    if ($('pw').value.trim().toLowerCase() !== 'caillou') {
        $('lock-sheet').classList.remove('shake'); void $('lock-sheet').offsetWidth; $('lock-sheet').classList.add('shake');
        return;
    }
    S.unlocked = true;
    closeSheets();
    setTimeout(afterListen, 250);
};

for (const b of document.querySelectorAll('#device-sheet .choice')) b.onclick = () => {
    S.owned = b.dataset.owned === 'yes';
    b.classList.add('selected');
    setTimeout(() => { closeSheets(); b.classList.remove('selected'); setTimeout(afterListen, 250); }, 280);
};

function openPebbble(p, fromLibrary) {
    stop();
    Object.assign(S, { pebbble: p, fromLibrary, view: 'pebbble', idx: 0, time: 0, started: false, unlocked: fromLibrary });
    render();
    // Opening a pebbble plays its first voice (the tap on the stone counts as the touch browsers require).
    const first = playable()[0];
    if (first) { playAt(first.i); openPlayer(); }
}

// ---------- this pebbble: edit / forget / settings ----------
function openMenu() {
    const p = S.pebbble;
    $('menu-stone').innerHTML = stone(p.seed, 'thumb');
    $('menu-name').textContent = p.name;
    $('m-edit').hidden = !S.creator;
    $('m-forget').hidden = !S.owned;
    resetForget();
    openSheet('menu-sheet');
}
function resetForget() {
    $('m-forget').classList.remove('confirm');
    $('m-forget').innerHTML = `${ICON.leaf}<span><b>Forget on this phone</b><span>Its voices leave this phone. The stone keeps them: tap it to bring them back.</span></span>`;
}
$('m-edit').onclick = () => { closeSheets(); toast('Opens the writer on this pebbble'); };
$('m-settings').onclick = () => openSheet('settings-sheet');
$('m-forget').onclick = () => {
    const b = $('m-forget');
    if (!b.classList.contains('confirm')) {
        b.classList.add('confirm');
        b.innerHTML = `${ICON.leaf}<span><b>Tap again to forget “${esc(S.pebbble.name)}”</b><span>Nothing changes on the stone.</span></span>`;
        return;
    }
    const gone = S.pebbble;
    stop(); closeSheets();
    S.library = S.library.filter(p => p !== gone);
    S.view = 'library'; S.fromLibrary = false;
    render();
    toast(`${gone.name} forgotten on this phone`);
};

// ---------- sheets ----------
function openSheet(id) {
    closeSheets(true);
    $('scrim').classList.add('on');
    $(id).classList.add('on');
    if (id === 'settings-sheet') renderSettings();
}
function closeSheets(keepScrim) {
    for (const s of document.querySelectorAll('.sheet')) s.classList.remove('on');
    if (!keepScrim) $('scrim').classList.remove('on');
    renderMini();
}
$('scrim').onclick = () => closeSheets();

function renderSettings() {
    for (const c of document.querySelectorAll('#settings-sheet .choice')) c.classList.toggle('selected', (c.dataset.mode === 'yes') === !!S.owned);
}
for (const c of document.querySelectorAll('#settings-sheet .choice')) c.onclick = () => {
    const owned = c.dataset.mode === 'yes';
    if (!owned && S.owned && !confirm('Remove the saved voices from this phone?')) return;
    S.owned = owned; renderSettings();
    toast(owned ? 'Voices will be kept on this phone' : 'Nothing is kept on this phone');
};
for (const b of document.querySelectorAll('#langs button')) b.onclick = () => {
    for (const x of document.querySelectorAll('#langs button')) x.classList.toggle('on', x === b);
    toast('The app follows this language');
};
$('clear').onclick = () => { if (confirm('Remove the saved voices from this phone?')) toast('Saved voices removed'); };

// ---------- playback (pretend: time advances, no sound) ----------
let tick = null;
function playAt(i) {
    S.idx = i; S.time = 0; S.started = true;
    play();
}
function play() { S.playing = true; clearInterval(tick); tick = setInterval(step, 250); update(); }
function pause() { S.playing = false; clearInterval(tick); update(); }
function stop() { pause(); S.started = false; $('mini').classList.remove('on'); }
function step() {
    S.time += 0.25 * 8; // pretend time runs 8× faster, so a voice ends in a few seconds
    if (S.sleep > 0) {
        S.sleepLeft -= 0.25 * 8;
        if (S.sleepLeft <= 0) { S.sleep = 0; pause(); toast('Sleep timer: paused. Good night.'); return; }
    }
    if (S.time >= current().d) return ended();
    update(false);
}
function ended() {
    if (S.repeat === 'one') { S.time = 0; return update(); }
    if (S.sleep === -1) { S.sleep = 0; pause(); S.time = current().d; toast('Stopped at the end of the voice'); return; }
    const list = playable(), pos = list.findIndex(v => v.i === S.idx);
    if (pos < list.length - 1) return playAt(list[pos + 1].i);
    if (S.repeat === 'all') return playAt(list[0].i);
    pause(); S.time = current().d; update();
}
function skip(dir) {
    const list = playable(), pos = list.findIndex(v => v.i === S.idx);
    if (dir < 0 && S.time > 5) { S.time = 0; return update(); }
    const next = list[(pos + dir + list.length) % list.length];
    playAt(next.i);
}

function update(full = true) {
    const v = current();
    const pct = Math.min(1, S.time / v.d) * 100;
    $('fill').style.width = pct + '%';
    $('dot').style.left = pct + '%';
    $('t-now').textContent = mmss(S.time);
    $('t-left').textContent = '-' + mmss(Math.max(0, v.d - S.time));
    $('mini-line').style.width = pct + '%';
    $('play').innerHTML = S.playing ? ICON.pause : ICON.play;
    $('mini-play').innerHTML = S.playing ? ICON.pauseLine : ICON.playLine;
    $('pl-stone').classList.toggle('breathing', S.playing);
    $('sleep').innerHTML = `${ICON.moon}<span>${S.sleep > 0 ? `Sleep in ${mmss(S.sleepLeft)}` : S.sleep === -1 ? 'After this voice' : 'Sleep timer'}</span>`;
    if (!full) return;
    $('pl-title').textContent = v.t;
    $('pl-sub').textContent = `${S.pebbble.name} · ${playable().findIndex(x => x.i === S.idx) + 1} of ${playable().length}`;
    $('pl-from').textContent = S.pebbble.name;
    $('pl-stone').innerHTML = stone(S.pebbble.seed);
    $('mini-stone').innerHTML = stone(S.pebbble.seed, 'thumb');
    $('mini-title').textContent = v.t;
    $('mini-sub').textContent = S.pebbble.name;
    $('repeat').innerHTML = `${ICON.repeat}<span>${{ off: 'Repeat off', one: 'Repeat this voice', all: 'Repeat all' }[S.repeat]}</span>`;
    $('repeat').classList.toggle('active', S.repeat !== 'off');
    $('sleep').classList.toggle('active', S.sleep !== 0);
    if (S.view === 'pebbble') {
        const lis = document.querySelectorAll('.voice[data-i]');
        if (lis.length) render(true);
    }
}
function renderMini() {
    const playerOpen = $('player').classList.contains('on');
    const anySheet = [...document.querySelectorAll('.sheet')].some(s => s.classList.contains('on'));
    $('mini').classList.toggle('on', !!S.started && !playerOpen && !anySheet && S.view === 'pebbble');
}

function openPlayer() { update(); openSheet('player'); $('scrim').classList.remove('on'); renderMini(); }
$('collapse').onclick = () => { closeSheets(); render(true); };
$('mini-open').onclick = e => { if (!e.target.closest('#mini-play')) openPlayer(); };
$('mini-play').onclick = () => (S.playing ? pause() : play());
$('play').onclick = () => (S.playing ? pause() : play());
$('prev').onclick = () => skip(-1);
$('next').onclick = () => skip(1);
$('progress').onclick = e => { const r = $('progress').getBoundingClientRect(); S.time = (e.clientX - r.left) / r.width * current().d; update(false); };
$('repeat').onclick = () => { S.repeat = { off: 'all', all: 'one', one: 'off' }[S.repeat]; update(); };
const SLEEP = [[0, 'Off'], [15, '15 min'], [30, '30 min'], [45, '45 min'], [60, '1 hour'], [-1, 'End of voice']];
$('sleep').onclick = () => {
    const box = $('sleep-choices');
    box.hidden = !box.hidden;
    box.innerHTML = SLEEP.map(([m, l]) => `<button data-m="${m}" class="${S.sleep === m ? 'on' : ''}">${l}</button>`).join('');
    for (const b of box.querySelectorAll('button')) b.onclick = () => {
        S.sleep = +b.dataset.m;
        S.sleepLeft = S.sleep > 0 ? S.sleep * 60 : 0; // seconds; pretend time runs 8× faster
        box.hidden = true; update();
        if (S.sleep) toast(S.sleep > 0 ? `Pauses in ${b.textContent}` : 'Stops after this voice');
    };
};

let toastT;
function toast(msg) { $('toast').textContent = msg; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2200); }

$('m-edit').innerHTML = `${ICON.pen}<span><b>Edit this pebbble</b><span>Add voices, rename, change the password. Only on your phone.</span></span>`;
$('m-settings').innerHTML = `${ICON.gear}<span><b>Settings</b><span>Language, this phone, saved voices.</span></span>`;

// ---------- scenes ----------
function scene(name) {
    closeSheets(); stop();
    Object.assign(S, { repeat: 'off', sleep: 0, unlocked: false, creator: false, fromLibrary: false, library: PEBBBLES });
    const L = PEBBBLES[0], M = PEBBBLES[1];
    if (name === 'first') { Object.assign(S, { view: 'arrival', pebbble: L, owned: null }); render(); }
    if (name === 'locked') { Object.assign(S, { view: 'arrival', pebbble: M, owned: true }); render(); }
    if (name === 'listening') { Object.assign(S, { view: 'pebbble', pebbble: L, owned: true }); playAt(0); S.time = 40; render(); openPlayer(); }
    if (name === 'library') { Object.assign(S, { view: 'library', owned: true }); render(); }
    if (name === 'empty') { Object.assign(S, { view: 'library', owned: true, library: [] }); render(); }
    if (name === 'settings') { Object.assign(S, { view: 'library', owned: true }); render(); setTimeout(() => openSheet('settings-sheet'), 300); }
    if (name === 'creator') { Object.assign(S, { view: 'pebbble', pebbble: L, owned: true, creator: true, fromLibrary: true }); render(); setTimeout(openMenu, 300); }
    if (name === 'forget') { Object.assign(S, { view: 'pebbble', pebbble: PEBBBLES[2], owned: true, fromLibrary: true }); render(); setTimeout(openMenu, 300); }
}
$('scene').onchange = () => scene($('scene').value);
$('hide-scenes').onclick = () => document.body.classList.add('hide-scenes');
document.addEventListener('click', e => { if (e.clientY < 12) document.body.classList.remove('hide-scenes'); });

const start = new URLSearchParams(location.search).get('scene') || 'first';
$('scene').value = start;
scene(start);
</script>
</body>
