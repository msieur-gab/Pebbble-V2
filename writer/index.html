<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pebbble Writer</title>
    <link rel="stylesheet" href="../shared/base.css">
</head>
<body>
<main>
    <h1>Pebbble Writer</h1>

    <details id="settings">
        <summary>Storage settings</summary>
        <p class="muted">Kept on this device only. Create them in Cloudflare → R2 → Manage API tokens (Object Read &amp; Write, this bucket only).</p>
        <label>Account ID <input name="accountId" autocomplete="off"></label>
        <label>Access key ID <input name="accessKeyId" autocomplete="off"></label>
        <label>Secret access key <input name="secretAccessKey" type="password" autocomplete="off"></label>
        <label>Bucket <input name="bucket" autocomplete="off"></label>
        <label>Public bucket URL <input name="publicBase" placeholder="https://pub-….r2.dev"></label>
        <button id="save-settings">Save settings</button>
    </details>

    <section id="start">
        <button id="new">New pebbble</button>
        <button id="scan" class="quiet">Open a pebbble by tapping it</button>
        <label>…or paste its link <input id="link" placeholder="https://…#id.key"></label>
        <button id="open-link" class="quiet">Open link</button>
        <p id="start-msg" class="muted"></p>
    </section>

    <section id="editor" hidden>
        <h2 id="editor-title">New pebbble</h2>

        <div id="unlock" hidden>
            <p>This pebbble has a password. Hint: <em id="unlock-hint"></em></p>
            <label>Password <input id="unlock-pw" type="password"></label>
            <button id="unlock-btn">Unlock to edit</button>
        </div>

        <div id="fields">
            <label>Owner name <input id="owner-name" placeholder="This pebbble belongs to…"></label>
            <label>Owner contact <input id="owner-contact" placeholder="If found, contact…"></label>

            <div id="pw-new">
                <label>Password (optional) <input id="pw" type="password" autocomplete="new-password"></label>
                <label>Hint shown to everyone <input id="hint"></label>
            </div>
            <p id="pw-set" class="muted" hidden>Password protected. Hint: <em id="hint-show"></em></p>

            <h2>Messages</h2>
            <div id="tracks"></div>

            <h2>Add a message</h2>
            <label>Title <input id="t-title"></label>
            <div class="row">
                <label>Audio file <input id="t-file" type="file" accept="audio/*"></label>
                <button id="t-rec" class="quiet">● Record</button>
            </div>
            <label>When can it be played?
                <select id="t-when">
                    <option value="">Always</option>
                    <option value="dates">Between two dates</option>
                    <option value="yearly">Every year</option>
                </select>
            </label>
            <div id="t-dates" class="row" hidden>
                <label>From <input id="t-from" type="date"></label>
                <label>To <input id="t-to" type="date"></label>
            </div>
            <div id="t-yearly" class="row" hidden>
                <label>From (MM-DD) <input id="t-every-a" placeholder="12-20" pattern="\d{2}-\d{2}"></label>
                <label>To (MM-DD) <input id="t-every-b" placeholder="12-27" pattern="\d{2}-\d{2}"></label>
            </div>
            <button id="t-add" class="quiet">Add message</button>

            <button id="save">Save pebbble</button>
            <p id="save-msg" class="muted"></p>
        </div>
    </section>

    <section id="done" hidden>
        <h2>Saved</h2>
        <p class="muted">Tag link:</p>
        <p><code id="done-url"></code></p>
        <button id="write-tag">Write to tag</button>
        <button id="copy" class="quiet">Copy link</button>
        <button id="try" class="quiet">Open in player</button>
        <p id="tag-msg" class="muted"></p>
    </section>
</main>
<script type="module" src="writer.js"></script>
</body>
</html>
